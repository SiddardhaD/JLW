name: jlw_approvals
description: Secure enterprise order approvals app for JLW built in Flutter.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  provider: ^6.0.5
  http: ^1.2.2
  intl: ^0.18.1
  pdfx: ^2.9.2
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  pdf: ^3.12.0
  device_info_plus: ^12.4.0
  android_id: ^0.5.1
  flutter_dotenv: ^6.0.1
  connectivity_plus: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env.dev
    - .env.staging
    - .env.prod
